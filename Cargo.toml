[workspace]
members = ["coreamp-app", "coreamp-common", "coreamp-daemon"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Polyform-Noncommercial-1.0.0"
version = "0.5.0"

[workspace.dependencies]
objc2 = "0.6"

# Release profile: balanced size + speed for a desktop app bundle. LTO
# and `codegen-units = 1` maximize cross-crate inlining; `strip` drops
# debuginfo from the final binary; `panic = "abort"` removes unwinding
# tables and shrinks the bundle. `dev` and `test` profiles are left at
# defaults so debug builds stay fast.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

