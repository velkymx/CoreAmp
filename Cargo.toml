[workspace]
members = ["coreamp-app", "coreamp-common", "coreamp-daemon"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Polyform-Noncommercial-1.0.0"
version = "0.5.0"

[workspace.dependencies]
# Pin the Tauri CLI to the same version family as the `tauri` crate
# (2.11.x). Local dev / CI should install via:
#   cargo install --locked tauri-cli --version 2.11.5
# `cargo tauri build` / `dev` resolve to this CLI at runtime.
tauri-cli = "=2.11.5"

# Release profile: balanced size + speed for a desktop app bundle. LTO
# and `codegen-units = 1` maximize cross-crate inlining; `strip` drops
# debuginfo from the final binary; `panic = "abort"` removes unwinding
# tables and shrinks the bundle. `dev` and `test` profiles are left at
# defaults so debug builds stay fast.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

